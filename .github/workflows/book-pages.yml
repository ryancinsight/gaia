name: Gaia mesh book

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/book-pages.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/book/**"
      - "rust-toolchain.toml"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/book-pages.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "docs/book/**"
      - "rust-toolchain.toml"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaia-mesh-book-${{ github.ref }}
  # Deploys queue behind one another; a half-cancelled deploy is worse than a
  # superseded one, and a cancelled default-branch run leaves that merge undeployed.
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.97.0
  MDBOOK_VERSION: 0.5.4
  MDBOOK_LINKCHECK2_VERSION: 0.12.2

jobs:
  build:
    name: Build and verify mesh book
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the book revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@062dc9e3eab0bad35531417c6bb6c6a7a184764f # v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}

      - name: Install the pinned link checker
        shell: bash
        run: cargo install mdbook-linkcheck2 --version "${MDBOOK_LINKCHECK2_VERSION}" --locked

      - name: Build Gaia and generate mesh figures
        shell: bash
        run: |
          set -euo pipefail
          artifact_list="$(mktemp)"
          trap 'rm -f "$artifact_list"' EXIT
          cargo build --locked --bin book_mesh_gallery \
            --message-format=json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact") | .filenames[]' \
            > "$artifact_list"
          cargo run --locked --quiet --bin book_mesh_gallery -- docs/book

          deps_dir="target/mdbook-test-libs"
          rm -rf "$deps_dir"
          mkdir -p "$deps_dir"
          while IFS= read -r artifact; do
            case "$artifact" in
              *.rlib|*.so) cp -p "$artifact" "$deps_dir/" ;;
            esac
          done < "$artifact_list"
          shopt -s nullglob
          gaia_libraries=("$deps_dir"/libgaia-*.rlib)
          if (( ${#gaia_libraries[@]} != 1 )); then
            printf 'expected exactly one staged Gaia library, found %s\\n' \
              "${#gaia_libraries[@]}" >&2
            exit 1
          fi

      - name: Verify book examples and links
        shell: bash
        run: mdbook test docs/book --library-path target/mdbook-test-libs

      - name: Build the Pages artifact
        shell: bash
        run: mdbook build docs/book

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/book/gaia/html

  deploy:
    name: Publish mesh book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
