[package]
name = "gaia"
version = "0.3.0"
edition = "2021"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ryancinsight/gaia"
homepage = "https://github.com/ryancinsight/gaia"
documentation = "https://docs.rs/gaia"
description = "Watertight CFD mesh generation for millifluidic devices — GhostCell-permissioned, indexed, BSP-based"
keywords = ["mesh", "cfd", "millifluidic", "watertight", "ghostcell"]
categories = ["science", "simulation"]
publish = true
autoexamples = false

[features]
default = []
millifluidic = []

stl-io = []
vtk-io = []
three-mf-io = ["dep:zip"]

mnemosyne-alloc = ["dep:mnemosyne"]
parallel = ["dep:moirai"]

[dependencies]
# Math

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Data structures
indexmap = "2.0"
slotmap = "1.0"
leto = { version = "0.40.0", git = "https://github.com/ryancinsight/leto.git", default-features = false, features = ["std", "serde"] }
eunomia = { version = "0.7.0", git = "https://github.com/ryancinsight/eunomia", default-features = false, features = ["std"] }
melinoe = { version = "0.9.0", git = "https://github.com/ryancinsight/melinoe.git", default-features = false }

# Mesh / geometry — state-of-the-art kernel
geometry-predicates = "0.3"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing
hashbrown = "0.15"

# 3MF export (optional)
zip = { version = "2.0", optional = true, default-features = false, features = ["deflate"] }

# Logging
tracing = "0.1"

# Randomness
rand = "0.8"

# Concurrency and Allocator Integrations
mnemosyne = { package = "mnemosyne-memory", version = "0.6.0", git = "https://github.com/ryancinsight/Mnemosyne.git", optional = true, default-features = false }
moirai = { package = "moirai-runtime", version = "0.4.0", git = "https://github.com/ryancinsight/Moirai.git", optional = true, default-features = false, features = ["parallel"] }

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"
mnemosyne = { package = "mnemosyne-memory", version = "0.6.0", git = "https://github.com/ryancinsight/Mnemosyne.git", default-features = false }
moirai = { package = "moirai-runtime", version = "0.4.0", git = "https://github.com/ryancinsight/Moirai.git", default-features = false, features = ["parallel"] }

# ── Benchmarks ─────────────────────────────────────────────────────────────────

[[bench]]
name = "csg_performance"
path = "benches/csg_performance.rs"
harness = false

[[bench]]
name = "hex_to_tet_performance"
path = "benches/hex_to_tet_performance.rs"
harness = false

